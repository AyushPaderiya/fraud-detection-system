artifacts:
  data_ingestion:
    train_data_path: artifacts/data/train.csv
    val_data_path: artifacts/data/val.csv
    test_data_path: artifacts/data/test.csv
    raw_data_path: artifacts/data/raw_data.csv
    source_data_path: notebook/data/paysim_fraud_data.csv

  data_transformation:
    preprocessor_path: artifacts/preprocessor.pkl

  model_trainer:
    model_path: artifacts/model.pkl
    evaluation_report_path: artifacts/evaluation_report.json
    confusion_matrix_path: artifacts/confusion_matrix.png
    roc_curve_path: artifacts/roc_curve.png
    pr_curve_path: artifacts/pr_curve.png

  data_validation:
    validation_report_path: artifacts/validation_report.txt

model_params:
  RandomForest:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 20
    min_samples_leaf: 10
    class_weight: balanced
    n_jobs: -1
    random_state: 42
    max_features: sqrt

  XGBoost:
    n_estimators: 100
    max_depth: 7
    learning_rate: 0.1
    n_jobs: -1
    random_state: 42
    tree_method: hist
    eval_metric: aucpr

  LightGBM:
    n_estimators: 100
    max_depth: 7
    learning_rate: 0.1
    random_state: 42
    n_jobs: -1
    verbose: -1

  LogisticRegression:
    max_iter: 500
    class_weight: balanced
    solver: saga
    tol: 0.001
    n_jobs: -1
    random_state: 42
